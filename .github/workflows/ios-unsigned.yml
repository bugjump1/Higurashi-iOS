name: Build unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      chapter_number:
        description: Higurashi chapter to build
        required: true
        type: choice
        default: '01'
        options:
          - '01'
          - '02'
          - '03'
          - '04'
          - '05'
          - '06'
          - '07'
          - '08'
          - 'all'
      bundle_identifier:
        description: Optional Bundle ID override before self-signing
        required: false
  push:
    branches:
      - main
      - develop

permissions:
  actions: write
  contents: read

concurrency:
  group: ios-unsigned-${{ github.ref }}-${{ inputs.chapter_number || '01' }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Test touch and traversal core
        run: dotnet run --project tools/Higurashi.Core.SmokeTests/Higurashi.Core.SmokeTests.csproj

      - name: Compile local data-pack tool
        run: dotnet build tools/Higurashi.DataPack/Higurashi.DataPack.csproj --configuration Release

      - name: Compile Buriko script-audit tool
        run: dotnet build tools/Higurashi.ScriptAudit/Higurashi.ScriptAudit.csproj --configuration Release

      - name: Compile Buriko runtime probe
        run: dotnet build tools/Higurashi.RuntimeProbe/Higurashi.RuntimeProbe.csproj --configuration Release

  export-xcode:
    name: Export Xcode project
    needs: core-tests
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        chapter_number: ${{ fromJSON(inputs.chapter_number == 'all' && '["01","02","03","04","05","06","07","08"]' || format('["{0}"]', inputs.chapter_number)) }}
    env:
      CHAPTER_NUMBER: ${{ matrix.chapter_number }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Restore chapter app icon
        shell: bash
        env:
          APP_ICON_BASE64_1: ${{ matrix.chapter_number == '08' && secrets.HIGURASHI_EP08_APP_ICON_BASE64_1 || matrix.chapter_number == '07' && secrets.HIGURASHI_EP07_APP_ICON_BASE64_1 || matrix.chapter_number == '06' && secrets.HIGURASHI_EP06_APP_ICON_BASE64_1 || matrix.chapter_number == '05' && secrets.HIGURASHI_EP05_APP_ICON_BASE64_1 || matrix.chapter_number == '04' && secrets.HIGURASHI_EP04_APP_ICON_BASE64_1 || matrix.chapter_number == '03' && secrets.HIGURASHI_EP03_APP_ICON_BASE64_1 || matrix.chapter_number == '02' && secrets.HIGURASHI_EP02_APP_ICON_BASE64_1 || secrets.HIGURASHI_APP_ICON_BASE64_1 }}
          APP_ICON_BASE64_2: ${{ matrix.chapter_number == '08' && secrets.HIGURASHI_EP08_APP_ICON_BASE64_2 || matrix.chapter_number == '07' && secrets.HIGURASHI_EP07_APP_ICON_BASE64_2 || matrix.chapter_number == '06' && secrets.HIGURASHI_EP06_APP_ICON_BASE64_2 || matrix.chapter_number == '05' && secrets.HIGURASHI_EP05_APP_ICON_BASE64_2 || matrix.chapter_number == '04' && secrets.HIGURASHI_EP04_APP_ICON_BASE64_2 || matrix.chapter_number == '03' && secrets.HIGURASHI_EP03_APP_ICON_BASE64_2 || matrix.chapter_number == '02' && secrets.HIGURASHI_EP02_APP_ICON_BASE64_2 || secrets.HIGURASHI_APP_ICON_BASE64_2 }}
        run: |
          set -euo pipefail
          if [[ -z "$APP_ICON_BASE64_1" || -z "$APP_ICON_BASE64_2" ]]; then
            echo "HIGURASHI_APP_ICON_BASE64_1/2 secrets are required." >&2
            exit 1
          fi
          mkdir -p ios-port/Assets/Branding
          printf '%s%s' "$APP_ICON_BASE64_1" "$APP_ICON_BASE64_2" | base64 --decode \
            > ios-port/Assets/Branding/AppIcon.png

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: ios-port/Library
          key: unity-library-ios-${{ hashFiles('ios-port/ProjectSettings/ProjectVersion.txt', 'ios-port/Packages/manifest.json', 'ios-port/Assets/**') }}
          restore-keys: |
            unity-library-ios-

      - name: Export iOS Xcode project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ios-port
          unityVersion: auto
          targetPlatform: iOS
          buildMethod: Higurashi.IOS.Editor.IOSBuild.Build
          buildsPath: build
          buildName: iOS
          versioning: None
          allowDirtyBuild: true
          customParameters: >-
            -customBuildPath /github/workspace/build/iOS
            -chapterNumber ${{ env.CHAPTER_NUMBER }}
            -bundleIdentifier ${{ inputs.bundle_identifier || format('com.bugjump.higurashi.ep{0}', env.CHAPTER_NUMBER) }}
            -buildNumber ${{ github.run_number }}

      - name: Upload Xcode project for compile job
        uses: actions/upload-artifact@v4
        with:
          name: Higurashi-${{ env.CHAPTER_NUMBER }}-XcodeProject-intermediate
          path: build/iOS
          if-no-files-found: error
          retention-days: 1
          compression-level: 6

  compile-unsigned:
    name: Compile unsigned IPA
    needs: export-xcode
    strategy:
      fail-fast: false
      matrix:
        chapter_number: ${{ fromJSON(inputs.chapter_number == 'all' && '["01","02","03","04","05","06","07","08"]' || format('["{0}"]', inputs.chapter_number)) }}
    env:
      CHAPTER_NUMBER: ${{ matrix.chapter_number }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download Xcode project
        uses: actions/download-artifact@v4
        with:
          name: Higurashi-${{ env.CHAPTER_NUMBER }}-XcodeProject-intermediate
          path: build/iOS

      - name: Show build environment
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Compile without code signing
        shell: bash
        run: |
          set -euo pipefail
          XCODE_PROJECT="$(find build/iOS -maxdepth 3 -type d -name 'Unity-iPhone.xcodeproj' -print -quit)"
          if [[ -z "$XCODE_PROJECT" ]]; then
            echo "Unity-iPhone.xcodeproj was not found under build/iOS." >&2
            find build/iOS -maxdepth 3 -print >&2
            exit 1
          fi
          echo "Using Xcode project: $XCODE_PROJECT"
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            TARGETED_DEVICE_FAMILY="1,2" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$APP_PATH" ]]; then
            echo "No .app product was generated." >&2
            exit 1
          fi

          mkdir -p artifacts/Payload
          ditto "$APP_PATH" "artifacts/Payload/$(basename "$APP_PATH")"
          (
            cd artifacts
            ditto -c -k --sequesterRsrc --keepParent Payload "Higurashi-${CHAPTER_NUMBER}-iOS-unsigned.ipa"
          )

      - name: Upload IPA for final collection
        uses: actions/upload-artifact@v4
        with:
          name: Higurashi-${{ env.CHAPTER_NUMBER }}-IPA-intermediate
          path: artifacts/Higurashi-${{ env.CHAPTER_NUMBER }}-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  collect-unsigned-ipas:
    name: Collect unsigned IPA files
    needs: compile-unsigned
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download compiled IPA files
        uses: actions/download-artifact@v4
        with:
          pattern: Higurashi-*-IPA-intermediate
          path: release
          merge-multiple: true

      - name: Verify expected IPA files
        shell: bash
        env:
          CHAPTER_NUMBER: ${{ inputs.chapter_number }}
        run: |
          set -euo pipefail
          mapfile -t IPA_FILES < <(find release -maxdepth 1 -type f -name '*.ipa' -print | sort)
          EXPECTED=1
          if [[ "$CHAPTER_NUMBER" == "all" ]]; then
            EXPECTED=8
          fi
          if [[ "${#IPA_FILES[@]}" -ne "$EXPECTED" ]]; then
            echo "Expected $EXPECTED IPA file(s), found ${#IPA_FILES[@]}." >&2
            find release -maxdepth 2 -type f -print >&2
            exit 1
          fi
          printf 'Final IPA: %s\n' "${IPA_FILES[@]}"

      - name: Upload final unsigned IPA collection
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.chapter_number == 'all' && 'Higurashi-01-08-iOS-unsigned' || format('Higurashi-{0}-iOS-unsigned', inputs.chapter_number) }}
          path: release/*.ipa
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Remove intermediate artifacts from this run
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100
              }
            );
            for (const artifact of artifacts) {
              if (!artifact.name.endsWith('-intermediate')) continue;
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              });
              core.info(`Deleted intermediate artifact: ${artifact.name}`);
            }
